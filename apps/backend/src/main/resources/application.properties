spring.application.name=catalogo

# Las credenciales provienen de variables de entorno (consulta .env.example)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate: Flyway administra el esquema; Hibernate solo lo valida
spring.jpa.hibernate.ddl-auto=validate

# Flyway ejecuta los scripts de db/migration al iniciar
spring.flyway.enabled=true

server.port=8080

# Endpoint de salud: GET http://localhost:8080/actuator/health
management.endpoints.web.exposure.include=health
