spring.application.name=catalog

# When no profile is set, load application-local.properties (gitignored, local credentials).
# Real environment variables take precedence over that file, so CI and deployments are unaffected.
spring.profiles.default=local

# Credentials come from DB_URL, DB_USERNAME and DB_PASSWORD (see .env.example)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalog}
spring.datasource.username=${DB_USERNAME:catalog}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate: Flyway manages the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate

# Flyway: schema only by default. Local development, QA and the integration tests add classpath:db/seed
spring.flyway.locations=classpath:db/migration
# A database that already applied the seed keeps starting when the seed is no longer on the path.
# Flyway OSS rejects the "repeatable" type here (Redgate edition only), so "*:missing" is used instead.
spring.flyway.ignore-migration-patterns=*:missing

server.port=8080

# Health endpoint: GET http://localhost:8080/actuator/health
management.endpoints.web.exposure.include=health
