<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories</title>
  <link rel="stylesheet" href="css/categories.css">
</head>
<body>
  <header class="page-header">
    <h1>Categories</h1>
  </header>

  <main class="layout">
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">New category</h2>

      <form id="category-form" novalidate>
        <input type="hidden" id="category-id">

        <div class="field">
          <label for="category-name">Name <span aria-hidden="true">*</span></label>
          <input type="text" id="category-name" name="name" maxlength="100" required autocomplete="off">
        </div>

        <div class="field">
          <label for="category-description">Description</label>
          <textarea id="category-description" name="description" maxlength="500" rows="3"></textarea>
        </div>

        <p id="form-error" class="message message-error" role="alert" hidden></p>

        <div class="actions">
          <button type="submit" id="save-button" class="button button-primary">Create</button>
          <button type="button" id="cancel-button" class="button" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <h2 id="list-title">All categories</h2>

      <p id="list-status" class="message" role="status" hidden></p>
      <ul id="category-list" class="category-list"></ul>
    </section>
  </main>

  <script src="js/categories.js" type="module"></script>
</body>
</html>
