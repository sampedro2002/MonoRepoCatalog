server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy to the backend container. The Docker embedded DNS (127.0.0.11) resolves
    # "backend" at request time, so nginx starts even if the backend is still booting.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "http://backend:8080";
        # With a variable in proxy_pass nginx does not append the request URI itself,
        # so it must be added explicitly or every call would hit "/" and 404.
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files; unknown paths fall back to the single page app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
