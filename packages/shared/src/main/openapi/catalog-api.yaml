openapi: 3.0.3
info:
  title: Catalog API
  version: 1.0.0
  description: HTTP API exposed by the catalog backend. The typed Java client in packages/shared is generated from this file.
servers:
  - url: http://localhost:8080
paths:
  /api/health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Report whether the service is running
      responses:
        '200':
          description: The service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        default:
          description: Error response
          headers:
            X-Trace-Id:
              description: Identifier of this request, also written to the server log
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: UP
    ErrorResponse:
      type: object
      description: RFC 7807 problem details, extended with the trace id of the failing request
      required:
        - title
        - status
        - traceId
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: No static resource api/unknown.
        instance:
          type: string
          format: uri
        traceId:
          type: string
          example: 3f2b8c1e-9a7d-4e21-b0c4-6d5e8f1a2b3c
