openapi: 3.0.3
info:
  title: Catalog API
  version: 1.0.0
  description: HTTP API exposed by the catalog backend. The typed Java client in packages/shared is generated from this file.
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Products
paths:
  /api/health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Report whether the service is running
      responses:
        '200':
          description: The service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        default:
          $ref: '#/components/responses/Error'
  /api/products:
    get:
      tags:
        - Products
      operationId: listProducts
      summary: List all products, or search them by name
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive text to search for in the product name
          schema:
            type: string
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Products
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: The created product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Error'
  /api/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Products
      operationId: getProduct
      summary: Get one product
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
        - Products
      operationId: updateProduct
      summary: Replace the fields of a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: The updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Products
      operationId: deleteProduct
      summary: Delete a product
      responses:
        '204':
          description: The product was deleted
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: Error response
      headers:
        X-Trace-Id:
          description: Identifier of this request, also written to the server log
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: UP
    Product:
      type: object
      required:
        - id
        - name
        - price
        - stock
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          maxLength: 120
          example: Loja Coffee
        description:
          type: string
          maxLength: 500
        price:
          type: number
          format: double
          minimum: 0
          example: 12.0
        stock:
          type: integer
          minimum: 0
          example: 150
        imageUrl:
          type: string
          maxLength: 500
    ProductInput:
      type: object
      required:
        - name
        - price
        - stock
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
        price:
          type: number
          format: double
          minimum: 0
        stock:
          type: integer
          minimum: 0
        imageUrl:
          type: string
          maxLength: 500
    ErrorResponse:
      type: object
      description: RFC 7807 problem details, extended with the trace id of the failing request
      required:
        - title
        - status
        - traceId
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Product not found with id 99
        instance:
          type: string
          format: uri
        traceId:
          type: string
          example: 3f2b8c1e-9a7d-4e21-b0c4-6d5e8f1a2b3c
