name: QA Build and Push

# Fires after "Suitest E2E" finishes on the test branch, or by hand from the Actions tab.
# GitHub only delivers workflow_run events to copies of this file on the default branch:
# merge this PR to main for the automatic trigger, or use workflow_dispatch meanwhile.
on:
  workflow_run:
    workflows: ["Suitest E2E"]
    types: [completed]
    branches: [test]
  workflow_dispatch:

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/catalog-backend:qa
            ${{ vars.DOCKERHUB_USERNAME }}/catalog-backend:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/catalog-frontend:qa
            ${{ vars.DOCKERHUB_USERNAME }}/catalog-frontend:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
